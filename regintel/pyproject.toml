[project]
name = "regintel"
version = "0.1.0"
description = "Agentic regulatory compliance intelligence (ET AI Hackathon)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7", "pydantic-settings>=2.3", "pyyaml>=6.0", "rich>=13.7", "typer>=0.12",
  "pandas>=2.2", "numpy", "scipy>=1.13", "rank-bm25>=0.2.2", "python-docx>=1.1",
  "neo4j>=5.20", "openai>=1.40", "instructor>=1.4",
  "langgraph>=0.2", "langgraph-checkpoint-sqlite>=2.0",
  "streamlit>=1.40", "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
ml        = ["docling>=2.0", "pymupdf>=1.24", "sentence-transformers>=3.0"]
mcp       = ["mcp>=1.6"]
anthropic = ["anthropic>=0.34"]
postgres  = ["psycopg[binary]>=3.1", "langgraph-checkpoint-postgres>=2.0"]
dev       = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regintel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"